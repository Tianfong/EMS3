<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — FDB NPI Command Center</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 80% -10%, #0e1a33 0%, #0b1220 55%);
    color: #e2e8f0; font-family: "Segoe UI", Inter, Arial, sans-serif; text-align: center; padding: 24px;
  }
  .card {
    max-width: 560px; width: 100%; padding: 48px 36px;
    background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 20px; box-shadow: 0 24px 70px rgba(2, 6, 23, 0.6);
  }
  .fan { width: 84px; height: 84px; margin: 0 auto 18px; animation: spin 9s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 72px; font-weight: 800; letter-spacing: -2px;
       background: linear-gradient(90deg, #38bdf8, #22d3a7); -webkit-background-clip: text;
       background-clip: text; color: transparent; margin-bottom: 6px; }
  h2 { font-size: 20px; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; }
  p  { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 26px; }
  a.btn {
    display: inline-block; padding: 12px 26px; border-radius: 10px; text-decoration: none;
    font-weight: 700; font-size: 15px; color: #04121f;
    background: linear-gradient(90deg, #38bdf8, #0ea5e9); box-shadow: 0 8px 24px rgba(14, 165, 233, 0.35);
  }
  a.btn:hover { filter: brightness(1.08); }
  code { font-family: Consolas, "JetBrains Mono", monospace; font-size: 13px; color: #7dd3fc; }
</style>
</head>
<body>
  <main class="card">
    <svg class="fan" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="url(#fan)"/>
      <circle cx="16" cy="16" r="3.5" fill="#0b1220"/>
      <g fill="none" stroke="#0b1220" stroke-width="2.6" stroke-linecap="round">
        <path d="M16 12.5 C 20 4, 28 8, 24 14"/>
        <path d="M19.5 16 C 28 20, 24 28, 18 24"/>
        <path d="M12.5 16 C 4 20, 8 28, 14 24"/>
        <path d="M16 19.5 C 12 28, 4 24, 8 18"/>
      </g>
      <defs>
        <linearGradient id="fan" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#38bdf8"/>
          <stop offset="1" stop-color="#2563eb"/>
        </linearGradient>
      </defs>
    </svg>
    <h1>404</h1>
    <h2>This page took a different stage gate</h2>
    <p>The page you're looking for doesn't exist — it may have been moved, renamed,
    or never made it past EVT.</p>
    <a class="btn" href="/">← Back to the Command Center</a>
    <p style="margin-top: 22px; margin-bottom: 0;"><code>tianfong.github.io/EMS3</code></p>
  </main>
</body>
</html>
