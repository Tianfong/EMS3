<style>
/* ============================================================
   FDB NPI Command Center — Design System
   ============================================================ */
:root{
  --bg:#070c16; --bg2:#0a1220; --panel:rgba(17,26,43,.72); --panel-solid:#111a2b;
  --glass:rgba(255,255,255,.035); --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --txt:#e6edf7; --txt2:#94a3b8; --txt3:#64748b;
  --acc:#38bdf8; --acc2:#2563eb; --acc-soft:rgba(56,189,248,.14);
  --good:#34d399; --good-soft:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --bad:#f87171; --bad-soft:rgba(248,113,113,.15);
  --pur:#a78bfa; --pur-soft:rgba(167,139,250,.14);
  --shadow:0 10px 30px -12px rgba(2,6,23,.7);
  --r:16px; --r-sm:10px;
  --sidebar-w:242px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="light"]{
  --bg:#eef3fa; --bg2:#e6edf6; --panel:rgba(255,255,255,.82); --panel-solid:#ffffff;
  --glass:rgba(15,23,42,.03); --line:rgba(15,23,42,.10); --line2:rgba(15,23,42,.18);
  --txt:#0f172a; --txt2:#475569; --txt3:#7c8aa0;
  --acc:#0284c7; --acc2:#2563eb; --acc-soft:rgba(2,132,199,.10);
  --good:#059669; --good-soft:rgba(5,150,105,.10);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.10);
  --bad:#dc2626; --bad-soft:rgba(220,38,38,.10);
  --pur:#7c3aed; --pur-soft:rgba(124,58,237,.10);
  --shadow:0 10px 30px -14px rgba(15,23,42,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--txt);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 500px at 85% -10%,var(--acc-soft),transparent 60%),
    radial-gradient(700px 500px at -10% 30%,rgba(37,99,235,.10),transparent 60%),
    radial-gradient(700px 600px at 60% 110%,rgba(167,139,250,.08),transparent 60%),
    var(--bg);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--acc-soft)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:inherit}
.mono{font-family:var(--mono)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  margin-left:var(--sidebar-w);transition:margin .28s ease;
}
.view-area{flex:1;padding:18px 22px 8px;max-width:1560px;width:100%;margin:0 auto}

/* ---------- sidebar ---------- */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:60;
  display:flex;flex-direction:column;gap:14px;padding:18px 14px;
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.brand-logo{display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(56,189,248,.35))}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:15px;letter-spacing:.3px}
.brand-text span{font-size:10.5px;color:var(--txt3);letter-spacing:1.6px;text-transform:uppercase}
.sidebar-close{display:none;margin-left:auto}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--txt2);
  transition:.18s;position:relative;
}
.nav-item:hover{background:var(--glass);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,var(--acc-soft),transparent 80%);color:var(--txt)}
.nav-item.active::before{
  content:"";position:absolute;left:-14px;top:20%;bottom:20%;width:3px;
  border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc);
}
.nav-ico{width:20px;text-align:center;font-size:14px;opacity:.9}
.nav-badge{
  margin-left:auto;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;
  background:var(--bad-soft);color:var(--bad);
}
.nav-badge.amber{background:var(--warn-soft);color:var(--warn)}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.pulse-card{
  background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;
  display:flex;flex-direction:column;gap:7px;
}
.pulse-row{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2)}
.pulse-row strong{color:var(--txt);font-family:var(--mono)}
.pulse-row strong.warn{color:var(--warn)}
.mini-bars{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:2px}
.mini-bars i{
  flex:1;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:2px 2px 0 0;
  opacity:.85;transition:height .6s cubic-bezier(.2,.8,.2,1);min-width:4px;
}
.pulse-time{font-size:10.5px;color:var(--txt3)}
.foot-meta{font-size:10px;color:var(--txt3);text-align:center;letter-spacing:1px;text-transform:uppercase}
.scrim{
  position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(2px);
  z-index:55;opacity:0;pointer-events:none;transition:.25s;
}
.scrim.show{opacity:1;pointer-events:auto}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:12px 22px;border-bottom:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.crumbs{min-width:0}
.crumbs h1{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-sub{font-size:11.5px;color:var(--txt3);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.topbar-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.filter-chip{
  display:flex;align-items:center;gap:8px;padding:4px 8px 4px 10px;border-radius:12px;
  border:1px solid var(--line);background:var(--glass);
}
.fc-label{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3)}
.seg{display:flex;gap:2px;background:var(--glass);border-radius:9px;padding:2px}
.seg button{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:7px;color:var(--txt2);transition:.16s;
}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--acc);color:#04121f;box-shadow:0 2px 8px rgba(56,189,248,.4)}
[data-theme="light"] .seg button.on{color:#fff}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;
  border:1px solid var(--line);background:var(--glass);transition:.16s;color:var(--txt2);
}
.icon-btn:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-1px)}
.menu-btn{display:none}
.avatar{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f;font-weight:800;font-size:12px;
}
[data-theme="light"] .avatar{color:#fff}

/* ---------- ticker ---------- */
.ticker{
  display:flex;align-items:center;gap:10px;margin:12px 22px 0;padding:7px 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--glass);overflow:hidden;
}
.ticker-dot{
  width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;
  box-shadow:0 0 10px var(--good);animation:blink 1.6s infinite;
}
@keyframes blink{50%{opacity:.35}}
.ticker-track{display:flex;gap:34px;white-space:nowrap;animation:tick 38s linear infinite;font-size:12px}
.ticker-track b{color:var(--acc);font-family:var(--mono)}
.ticker-track .t-up{color:var(--good)} .ticker-track .t-dn{color:var(--bad)} .ticker-track .t-wa{color:var(--warn)}
@keyframes tick{to{transform:translateX(-50%)}}
.ticker:hover .ticker-track{animation-play-state:paused}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(5,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-32{grid-template-columns:2fr 1fr}
.g-23{grid-template-columns:1fr 2fr}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  min-width:0;position:relative;
}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h3{font-size:13px;font-weight:800;letter-spacing:.3px}
.card-head .sub{font-size:11px;color:var(--txt3);margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{
  font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.4px;
  background:var(--glass);border:1px solid var(--line);color:var(--txt2);
}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.pill.pur{background:var(--pur-soft);color:var(--pur);border-color:transparent}

/* KPI cards */
.kpi{overflow:hidden;cursor:pointer;transition:.2s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
.kpi::after{
  content:"";position:absolute;inset:0 0 auto 0;height:2.5px;
  background:linear-gradient(90deg,var(--kc,var(--acc)),transparent);
  opacity:.9;
}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.kpi-ico{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc);
}
.kpi-name{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3)}
.kpi-val{font-size:27px;font-weight:800;font-family:var(--mono);letter-spacing:-.5px}
.kpi-val small{font-size:13px;color:var(--txt3);font-weight:600}
.kpi-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.trend{font-size:11.5px;font-weight:700;font-family:var(--mono)}
.trend.up{color:var(--good)} .trend.dn{color:var(--bad)} .trend.fl{color:var(--txt3)}
.kpi-spark{margin-left:auto;width:86px;height:30px}
.kpi-note{font-size:10.5px;color:var(--txt3)}

/* tables */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{
  text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3);
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--glass);
  position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;
}
th:hover{color:var(--txt)}
th .arr{font-size:9px;color:var(--acc)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:.14s;cursor:pointer}
tbody tr:hover{background:var(--glass)}
tbody tr:last-child td{border-bottom:none}
td.mono{font-family:var(--mono);font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis}

/* stage pipeline */
.pipe{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:6px 2px}
.pipe-stage{
  flex:1;min-width:118px;position:relative;padding:12px 14px 12px 24px;
  background:var(--glass);border:1px solid var(--line);border-right:none;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);
  margin-left:-14px;cursor:pointer;transition:.18s;
}
.pipe-stage:first-child{margin-left:0;border-radius:10px 0 0 10px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:14px}
.pipe-stage:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.pipe-stage:hover{transform:translateY(-2px);z-index:2}
.pipe-stage.on{outline:2px solid var(--acc);outline-offset:-2px;z-index:1}
.pipe-stage .ps-name{font-size:12px;font-weight:800;letter-spacing:.6px}
.pipe-stage .ps-val{font-size:20px;font-weight:800;font-family:var(--mono);margin:2px 0}
.pipe-stage .ps-sub{font-size:10.5px;color:var(--txt3)}

/* progress bars */
.bar{height:7px;border-radius:6px;background:var(--glass);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar i.g{background:linear-gradient(90deg,var(--good),#10b981)}
.bar i.w{background:linear-gradient(90deg,var(--warn),#f59e0b)}
.bar i.b{background:linear-gradient(90deg,var(--bad),#ef4444)}

/* process flow */
.flow{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 2px}
.flow-node{
  flex:none;min-width:170px;background:var(--glass);border:1px solid var(--line);
  border-radius:14px;padding:12px;cursor:pointer;transition:.18s;position:relative;
}
.flow-node:hover{transform:translateY(-2px);border-color:var(--line2)}
.flow-node.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 22px -10px rgba(56,189,248,.5)}
.flow-arrow{flex:none;width:34px;height:2px;background:var(--line2);position:relative;margin:0 2px}
.flow-arrow::after{
  content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--line2);
}
.fn-head{display:flex;align-items:center;gap:8px}
.fn-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--acc-soft)}
.fn-name{font-size:12.5px;font-weight:800}
.fn-sub{font-size:10.5px;color:var(--txt3)}
.fn-kpis{display:flex;gap:12px;margin-top:8px}
.fn-kpi{flex:1}
.fn-kpi b{font-family:var(--mono);font-size:14px;display:block}
.fn-kpi span{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--txt3)}

/* gantt */
.gantt{position:relative}
.gantt-scroll{overflow-x:auto;overflow-y:hidden;padding-top:16px;scrollbar-width:thin}
.gantt-inner{min-width:760px;position:relative}
.gantt-row{display:grid;grid-template-columns:190px 1fr;gap:0;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
.gantt-row:hover{background:var(--glass)}
.g-label{padding:0 10px;min-width:0;position:sticky;left:0;z-index:2;background:inherit}
.g-label b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label span{font-size:10px;color:var(--txt3)}
.g-track{position:relative;height:30px;min-width:0}
.g-grid{position:absolute;inset:0;pointer-events:none}
.g-grid i{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-grid i.tick-major{border-left:1px solid var(--line2)}
.g-grid span{
  position:absolute;top:-15px;font-size:9.5px;color:var(--txt3);transform:translateX(-50%);
  font-family:var(--mono);white-space:nowrap;
}
.g-grid span.tick-major-lbl{color:var(--txt2);font-weight:700}
/* day zoom: date + 1-char weekday stacked */
.g-grid span.tick-date{top:-26px;transform:translateX(-50%)}
.g-grid span.tick-dow{
  top:-12px;transform:translateX(-50%);font-size:8.5px;color:var(--txt3);
  font-family:var(--mono);opacity:.85;
}
.g-grid span.tick-wknd{color:var(--txt3);opacity:.7}
.g-grid i.tick-wknd-line{opacity:.55}
.g-bar{
  position:absolute;top:5px;height:20px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;padding:0 9px;font-size:10px;font-weight:700;color:#04121f;
  transition:.16s;min-width:26px;box-shadow:0 3px 10px -3px rgba(2,6,23,.5);
  overflow:hidden;isolation:isolate;
  background:color-mix(in srgb,var(--pb,#0ea5e9) 14%,transparent);
  border:1px dashed color-mix(in srgb,var(--pb,#0ea5e9) 45%,transparent);
  touch-action:none;user-select:none;-webkit-user-select:none;
}
[data-theme="light"] .g-bar{color:#fff}
.g-bar:hover{transform:scale(1.015);filter:brightness(1.12)}
body.g-dragging, body.g-dragging *{cursor:col-resize !important}
body.g-dragging .g-bar{transition:none}
.g-bar .g-grip{
  position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pb,#0ea5e9) 55%,transparent));
  opacity:0;transition:.15s;border-radius:0 7px 7px 0;
}
.g-bar:hover .g-grip{opacity:1}
.g-fill{position:absolute;left:0;top:0;bottom:0;z-index:0;background:var(--pb,#0ea5e9);transition:width .3s}
.g-txt{position:relative;z-index:1;letter-spacing:.2px;pointer-events:none}
[data-theme="dark"] .g-txt-lo{color:#e0f2fe;text-shadow:0 1px 2px rgba(2,6,23,.55)}
[data-theme="light"] .g-txt-lo{color:#0b1220}
.g-bar.g-done{
  border-style:solid;
  box-shadow:0 4px 16px -3px color-mix(in srgb,var(--pb,#0ea5e9) 60%,transparent),
             0 0 0 1px color-mix(in srgb,var(--pb,#0ea5e9) 55%,transparent);
}
.g-bar.g-crit{
  border:1px solid var(--warn);
  animation:g-crit-pulse 1.8s ease-in-out infinite;
}
.g-bar.g-risk{
  border:1px solid var(--bad);
  animation:g-risk-pulse 1.5s ease-in-out infinite;
}
@keyframes g-crit-pulse{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 10%,transparent),0 0 14px -2px var(--warn)}
}
@keyframes g-risk-pulse{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 12%,transparent),0 0 16px -2px var(--bad)}
}
.g-deps{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.g-deps line{stroke:var(--txt3);stroke-width:1.4;stroke-dasharray:3 3}
.g-deps path{fill:var(--txt3)}
.g-today{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad);z-index:3;box-shadow:0 0 8px var(--bad)}

/* keep Today button visible on small screens */
#todayBtn{white-space:nowrap}
.g-today::after{content:"TODAY";position:absolute;top:-13px;left:-16px;font-size:8px;font-weight:800;color:var(--bad);letter-spacing:1px}

/* faca / claims */
.list{display:flex;flex-direction:column;gap:9px}
.item{
  display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:13px;
  background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.16s;
}
.item:hover{transform:translateX(3px);border-color:var(--line2)}
.item-ico{
  width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
  font-size:14px;font-weight:800;
}
.item-body{min-width:0;flex:1}
.item-title{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.item-meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

/* modal & toast */
.modal-back{
  position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.6);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:20px;animation:fade .2s;
}
@keyframes fade{from{opacity:0}}
.modal{
  width:min(720px,100%);max-height:86vh;overflow-y:auto;background:var(--panel-solid);
  border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(2,6,23,.8);
  animation:pop .25s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.modal-head{
  display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel-solid);z-index:2;border-radius:20px 20px 0 0;
}
.modal-head h2{font-size:16px;font-weight:800}
.modal-body{padding:18px 20px}
.modal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat-box{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat-box span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);display:block}
.stat-box b{font-family:var(--mono);font-size:18px}
.toast-root{position:fixed;bottom:18px;right:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--panel-solid);border:1px solid var(--line2);border-left:3px solid var(--acc);
  border-radius:12px;padding:11px 15px;font-size:12.5px;box-shadow:var(--shadow);
  animation:slide .3s cubic-bezier(.2,.9,.3,1.1);max-width:330px;
}
.toast.good{border-left-color:var(--good)} .toast.warn{border-left-color:var(--warn)} .toast.bad{border-left-color:var(--bad)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}

/* section head */
.sec-head{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.sec-head h2{font-size:14px;font-weight:800;letter-spacing:.3px}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--txt2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* sparkline text fallback */
.empty{padding:26px;text-align:center;color:var(--txt3);font-size:12px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-c b{font-size:23px;font-family:var(--mono)}
.donut-c span{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);display:block}
.donut-leg{display:flex;flex-direction:column;gap:8px;flex:1;min-width:150px}
.donut-leg .dl{display:flex;align-items:center;gap:8px;font-size:12px}
.donut-leg .dl b{margin-left:auto;font-family:var(--mono)}

/* topbar product select */
.topbar-select{
  background:var(--glass);border:1px solid var(--line2);border-radius:8px;
  color:var(--txt);font-size:11.5px;font-weight:700;padding:4px 6px;max-width:200px;
  outline:none;cursor:pointer;transition:.15s;
}
.topbar-select:hover{border-color:var(--acc)}
.topbar-select:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.topbar-select option{background:var(--panel-solid);color:var(--txt)}

/* form controls & buttons (manage layer) */
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--txt3)}
.fld span{font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{
  background:var(--glass);border:1px solid var(--line2);border-radius:9px;
  padding:8px 10px;font-size:13px;color:var(--txt);min-width:130px;outline:none;transition:.15s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.fld.grow{flex:1;min-width:180px}
.fld.grow input{width:100%}
.btn-primary{
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f;font-weight:800;
  padding:9px 16px;border-radius:10px;font-size:12.5px;transition:.16s;white-space:nowrap;
}
[data-theme="light"] .btn-primary{color:#fff}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.08)}
.mini-btn{
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--glass);color:var(--txt2);transition:.15s;white-space:nowrap;
}
.mini-btn:hover{color:var(--txt);border-color:var(--acc);transform:translateY(-1px)}

/* executive report */
.report-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.report-table th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);padding:7px 9px;border-bottom:1px solid var(--line2);background:var(--glass)}
.report-table td{padding:7px 9px;border-bottom:1px solid var(--line)}
.report-list{margin:4px 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--txt2)}
.report-list b{color:var(--txt)}

/* print: report only */
@media print{
  body *{visibility:hidden}
  .modal-back, .modal-back *{visibility:visible}
  .modal-back{position:absolute;inset:0;background:#fff;padding:0}
  .modal{box-shadow:none;border:none;max-height:none;width:100%}
  .modal-head{position:static;color:#0f172a}
  .icon-btn{display:none}
  body::before{display:none}
}

/* responsive */
@media (max-width:1250px){
  .g-kpi{grid-template-columns:repeat(3,1fr)}
  .g-3{grid-template-columns:1fr 1fr}
  .g-32,.g-23{grid-template-columns:1fr}
}
@media (max-width:1080px){
  .sidebar{transform:translateX(-104%);transition:transform .28s ease;box-shadow:0 0 60px rgba(2,6,23,.6)}
  .sidebar.open{transform:none}
  .sidebar-close{display:grid}
  .main{margin-left:0}
  .menu-btn{display:grid}
  .filter-chip{display:none}
  .filter-chip.keep{display:flex}
  #reportBtn{display:none}
  .filter-chip:has(#productSel){display:flex}
}
@media (max-width:760px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-3{grid-template-columns:1fr}
  .view-area{padding:14px 12px 6px}
  .topbar{padding:10px 12px}
  .ticker{margin:10px 12px 0}
  .crumb-sub{display:none}
  .toast-root{left:12px;right:12px}
  .toast{max-width:none}
  .kpi-val{font-size:23px}
  .avatar{display:none}
}
@media (max-width:440px){
  .g-kpi{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}

<script>
"use strict";
/* ============================================================
   FDB NPI Command Center — mock data layer
   Products X4151/X4152/... · RHS/LHS · Stages P1,P2,EVT,DVT,PVT
   KPIs: FPY, FY, UPH, OEE, Shipment, Claims, FACA, Gantt
   ============================================================ */

const DB = (() => {

  /* ---------- master lists ---------- */
  const STAGES = ["P1", "P2", "EVT", "DVT", "PVT"];
  const SIDES  = ["RHS", "LHS"];
  const RANGES = ["7D", "30D", "QTD", "YTD"];

  const PROCESSES = [
    { id:"rotor",    name:"Rotor Assembly",        ico:"🌀", target:{ fpy:97.0, uph:150, oee:82 } },
    { id:"pillow",   name:"Pillow-Stator Assembly",ico:"🧲", target:{ fpy:96.0, uph:120, oee:80 } },
    { id:"fan",      name:"Fan Assembly",          ico:"🔧", target:{ fpy:95.5, uph:180, oee:85 } },
    { id:"test",     name:"Fan Test Accessory",    ico:"🧪", target:{ fpy:98.5, uph:220, oee:88 } },
  ];

  const PRODUCTS = [
    { id:"X4151", name:"FDB 92mm · Server",      customer:"CloudCore",  stage:"DVT", side:"RHS+LHS", mule:"M4",      ramp:"2026-Q4", vol: { ytd: 41200, target: 45000 } },
    { id:"X4152", name:"FDB 120mm · High-CFM",   customer:"NovaServe",  stage:"DVT", side:"RHS+LHS", mule:"M4",      ramp:"2026-Q4", vol: { ytd: 38600, target: 40000 } },
    { id:"X4153", name:"FDB 80mm · Slim",        customer:"EdgeWave",   stage:"EVT", side:"RHS",     mule:"M3",      ramp:"2027-Q1", vol: { ytd: 12600, target: 15000 } },
    { id:"X4154", name:"FDB 120mm · Dual",       customer:"NovaServe",  stage:"PVT", side:"RHS+LHS", mule:"M5",      ramp:"2026-Q3", vol: { y_data:0, ytd: 52100, target: 50000 } },
    { id:"X4155", name:"FDB 60mm · Blade",       customer:"PicoCloud",  stage:"P1",  side:"LHS",     mule:"M1",      ramp:"2027-Q2", vol: { ytd: 2100,  target: 6000 } },
    { id:"X4156", name:"FDB 97mm · Silent",      customer:"CloudCore",  stage:"P2",  side:"RHS",     mule:"M2",      ramp:"2027-Q1", vol: { ytd: 5400,  target: 8000 } },
  ];
  PRODUCTS.forEach(p => delete p.vol.y_data);

  /* deterministic PRNG so refreshes are stable between reloads-ish */
  let seed = 4151;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  /* ---------- NPI build lots (configurations) per stage ----------
     P1 → MP11, MP12… · P2 → MP21… · EVT → ME11, ME12…
     DVT → MD11, MD12… · PVT → MV11, MV12…                       */
  const LOT_PREFIX = { P1:"MP1", P2:"MP2", EVT:"ME1", DVT:"MD1", PVT:"MV1" };
  const LOTS = [];
  STAGES.forEach(st => {
    const n = { P1:2, P2:2, EVT:3, DVT:3, PVT:2 }[st];
    for (let i = 1; i <= n; i++){
      LOTS.push({
        id: LOT_PREFIX[st] + i,                 // MP11, MP12 · ME11 · MD11…
        stage: st,
        units: Math.round(80 + i*60 + (st.length*37) % 90),
      });
    }
  });
  /* product → lots currently running (within the product's stage) */
  const PRODUCT_LOTS = {};
  {
    let li = 0;
    PRODUCTS.forEach(p => {
      const inStage = LOTS.filter(l => l.stage === p.stage);
      const take = Math.max(1, Math.min(2, inStage.length));
      const start = li % Math.max(1, inStage.length - take + 1);
      PRODUCT_LOTS[p.id] = inStage.slice(start, start + take).map(l => l.id);
      li++;
    });
    // guarantee at least one lot per product
    PRODUCTS.forEach(p => { if (!PRODUCT_LOTS[p.id] || !PRODUCT_LOTS[p.id].length) PRODUCT_LOTS[p.id] = [LOTS.find(l=>l.stage===p.stage).id]; });
  }

  /* ---------- per-lot KPI snapshot ---------- */
  const LOT_KPI = {};
  {
    const lotSeeds = { P1: 4113, P2: 4121, EVT: 8837, DVT: 8839, PVT: 10037 };
    LOTS.forEach((l, i) => {
      seed = lotSeeds[l.stage] + i * 1013;
      const sb = { P1:-3.4, P2:-2.1, EVT:-1.4, DVT:-0.6, PVT:0 }[l.stage];
      LOT_KPI[l.id] = {
        fpy: +clamp(96.4 + sb + (rnd()-0.5)*2.6, 86, 99.7).toFixed(1),
        fy:  +clamp(98.2 + sb*0.5 + (rnd()-0.5)*1.4, 92, 99.9).toFixed(1),
        uph: Math.round(clamp(150 + sb*7 + (rnd()-0.5)*40, 95, 200)),
        oee: +clamp(80 + sb + (rnd()-0.5)*9, 62, 93).toFixed(1),
      };
    });
  }

  /* ---------- lot task flow (per-lot build lifecycle) ----------
     Preparation → MBO and Main build → OQC → OK2S → Shipment
     (schedules generated after TODAY is defined — see below)        */
  const LOT_PHASES = ["Preparation", "MBO and Main build", "OQC", "OK2S", "Shipment"];

  /* ---------- KPI definitions ---------- */
  const KPIS = [
    { id:"fpy",   name:"FPY",  full:"First Pass Yield",      unit:"%",  target:96.5, good:"up",  ico:"✅", note:"rotor → test, blended" },
    { id:"fy",    name:"FY",   full:"Final Yield",           unit:"%",  target:98.5, good:"up",  ico:"🏁", note:"incl. rework recovery" },
    {
      id:"uph",   name:"UPH",  full:"Units Per Hour",        unit:"",   target:160,  good:"up",  ico:"⚡", note:"line-rated, blended",
      base: 148, spread: 14,
    },
    {
      id:"oee",   name:"OEE",  full:"Overall Equipment Effectiveness", unit:"%", target:82, good:"up", ico:"🏭", note:"A × P × Q",
      base: 78.5, spread: 6,
    },
    { id:"ship",  name:"SHIP", full:"Shipment Achievement",  unit:"%",  target:100,  good:"up",  ico:"📦", note:"commit vs actual" },
    { id:"claim", name:"CLAIM",full:"Customer Claims",       unit:"",   target:0,    good:"down",ico:"⚑",  note:"open claims this quarter" },
    { id:"faca",  name:"FACA", full:"FACA Actions",          unit:"",   target:0,    good:"down",ico:"✎",  note:"open FACA actions" },
  ];

  /* ---------- deterministic series generator ---------- */
  function series(n, base, spread, drift=0, floor=null, ceil=null){
    const out = [];
    let v = base;
    for (let i=0;i<n;i++){
      v += (rnd()-0.5)*spread + drift;
      if (floor!==null) v = Math.max(floor, v);
      if (ceil !==null) v = Math.min(ceil, v);
      out.push(v);
    }
    return out;
  }

  const N = 42; // days of history
  const KPI_SERIES = {};
  KPIS.forEach(k => {
    if (k.id === "fpy")   KPI_SERIES.fpy   = series(N, 96.2, 1.1, 0.012, 93.2, 99.1);
    if (k.id === "fy")    KPI_SERIES.fy    = series(N, 98.3, 0.7, 0.006, 96.4, 99.9);
    if (k.id === "uph")   KPI_SERIES.uph   = series(N, k.base, k.spread, 0.05, 118, 182);
    if (k.id === "oee")   KPI_SERIES.oee   = series(N, k.base, k.spread, 0.02, 68, 91);
    if (k.id === "ship")  KPI_SERIES.ship  = series(N, 97.5, 4.5, 0.01, 86, 100);
    if (k.id === "claim") KPI_SERIES.claim = series(N, 4, 1.6, -0.01, 1, 9).map(Math.round);
    if (k.id === "faca")  KPI_SERIES.faca  = series(N, 5, 1.4, -0.01, 2, 9).map(Math.round);
  });

  /* ---------- per-product KPI snapshot ---------- */
  const PRODUCT_KPI = {};
  PRODUCTS.forEach(p => {
    seed = p.id.slice(1) * 97 + 13; // per-product seed
    const stageBoost = { P1:-3.2, P2:-1.8, EVT:-1.2, DVT:-0.4, PVT:0 }[p.stage];
    PRODUCT_KPI[p.id] = {
      fpy:   clamp(96.4 + stageBoost + (rnd()-0.5)*2.2, 86, 99.6),
      fy:    clamp(98.2 + stageBoost*0.5 + (rnd()-0.5)*1.2, 92, 99.9),
      uph:   Math.round(clamp(150 + stageBoost*6 + (rnd()-0.5)*36, 92, 195)),
      oee:   clamp(80 + stageBoost + (rnd()-0.5)*8, 63, 92),
      ship:  clamp(97 + (rnd()-0.5)*8, 84, 100),
      claim: Math.round(rnd()*3.4),
      faca:  Math.round(rnd()*3.4),
    };
    PRODUCT_KPI[p.id].fpys = series(28, PRODUCT_KPI[p.id].fpy, 1.3, 0.01, 84, 99.6);
  });

  /* ---------- per-process KPI snapshot (x stage) ---------- */

  /* control-chart stats: X-chart for daily FPY samples */
  function spcStats(series, target){
    const n = series.length;

    const sd = Math.sqrt(series.reduce((s,v)=>s+(v-cl)*(v-cl),0)/Math.max(1,n-1));
    return { cl, sd, ucl: cl + 3*sd, lcl: Math.max(0, cl - 3*sd), target };
  }

  /* Western Electric rules — earlier sensitivity than the ±3σ rule alone.
     Returns map: index -> ["R1","R3",…]. */
  function westernElectric(series, st){
    const { cl, sd, ucl, lcl } = st;
    const z = series.map(v => sd ? (v - cl)/sd : 0);
    const hits = {};
    const add = (i, r) => { (hits[i] = hits[i] || []).push(r); };
    const above = z.map(v => v > 0), below = z.map(v => v < 0);
    for (let i = 0; i < series.length; i++){
      // R1: beyond 3σ (kept for completeness — chart already rings these)
      if (series[i] > ucl || series[i] < lcl) add(i, "R1");
      // R2: 2 of 3 consecutive beyond 2σ, same side
      for (const side of [1, -1]){
        const win = [i-2, i-1, i].filter(j => j >= 0);
        if (win.length === 3){
          const cnt = win.filter(j => side*z[j] > 2).length;
          const mid = win[1];
          if (cnt >= 2 && side*z[mid] > 2) add(i, "R2");
        }
      }
      // R3: 4 of 5 consecutive beyond 1σ, same side
      for (const side of [1, -1]){
        const win = [i-4, i-3, i-2, i-1, i].filter(j => j >= 0);
        if (win.length === 5){
          const cnt = win.filter(j => side*z[j] > 1).length;
          if (cnt >= 4 && side*z[i] > 1) add(i, "R3");
        }
      }
      // R4: 8 consecutive on one side of CL
      if (i >= 7){
        const win = z.slice(i-7, i+1);
        if (win.every(v => v > 0) || win.every(v => v < 0)) add(i, "R4");
      }
    }
    return hits;
  }
  function spcSamples(lotId){
    const n = 30;
    const labels = labelsForSeries(n);
    const lot = lotId && lotId !== "ALL" ? LOTS.find(l => l.id === lotId) : null;
    const prods = lot
      ? PRODUCTS.filter(p => (PRODUCT_LOTS[p.id] || []).includes(lot.id))
      : PRODUCTS.filter(p => STATE.product==="ALL" || p.id===STATE.product);
    const stages = lot ? [lot.stage] : STAGES.filter(s => STATE.stage==="ALL" || s===STATE.stage);
    /* deterministic per-lot signature — same lot always renders the same series */
    const lotSeed = lot ? lot.id.charCodeAt(2)*13 + lot.id.charCodeAt(3)*29 + lot.id.charCodeAt(1) : 0;
    const lotOff = lot ? ({P1:-1.1,P2:-0.6,EVT:-0.25,DVT:0.1,PVT:0.2}[lot.stage]||0) + ((lotSeed % 5) - 2) * 0.16 : 0;
    const data = [];

      if (lot){
        /* lot-level view: family curve + lot signature + its own shifted echoes of the causes */
        v += lotOff + Math.sin(i/2.1 + lotSeed % 7)*0.22 + (((lotSeed + i*7) % 9) - 4)*0.06;
        const ev = { 7:-1.9, 16:-1.2, 23:-2.4, 28:+0.7 };
        for (const k in ev){ if (i === (Number(k) + lotSeed % 5) % n) v += ev[k]; }

      data.push(+(v + pb).toFixed(2));
    }
    return { labels, data, stages, lot: lot ? lot.id : null };
  }
  function labelsForSeries(n){
    const out = [];
    for (let i = n-1; i >= 0; i--){
      const d = new Date(TODAY); d.setDate(d.getDate()-i);

  /* ---------- persistence (manage layer: edits survive reload) ---------- */

    }));
    /* overdue lot phases (Gantt at-risk rows) */
    Object.keys(LOT_TASKS).forEach(lotId => {
      const lot = LOTS.find(l => l.id === lotId); if (!lot) return;
      (LOT_TASKS[lotId] || []).forEach(t => {
        if (t.done < 100 && t.e && t.e < todayIso) out.push({ sev:"bad", txt:`${lotId} ${lot.stage} phase overdue: ${t.name} (ended ${t.e} at ${t.done}%)` });
      });
    });
    /* live SPC signals from the current sample window */
    try {
      const { data } = spcSamples();
      const st = spcStats(data);
      const ooc = data.filter(v => v > st.ucl || v < st.lcl).length;
      const we = westernElectric(data, st);

      if (ooc) out.push({ sev:"bad", txt:`SPC: ${ooc} point(s) beyond ±3σ on the FPY control chart — investigate special cause` });
      if (weN) out.push({ sev:"warn", txt:`SPC: ${weN} Western Electric signal(s) — early drift before a breach` });
    } catch(e){}
    return out;
  }
  function allAlerts(){ return dynamicAlerts().concat(SYSTEM_ALERTS); }

  /* ---------- public API ---------- */
  return {
    STAGES, SIDES, RANGES, LOTS, PRODUCT_LOTS, LOT_KPI, LOT_PHASES, LOT_TASKS,

    updateClaim, addClaim, updateFaca, updateProjectTasks, updateLotTasks, resetOverrides, LS_KEY,
    allAlerts, DEFECTS, spcStats, spcSamples, westernElectric,
    fmtW: n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"") + "k" : String(n),
  };
})();

  }

  /* line/area chart with hover crosshair */
  function lineChart(el, opts){
    const pts = opts.data;
    const W = 720, H = 240, padL = 40, padR = 14, padT = 16, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const min = Math.min(...pts), max = Math.max(...pts);
    const range = (max - min) || 1;
    const lo = min - range*0.15, hi = max + range*0.15;
    const X = i => padL + i*iw/(pts.length-1);
    const Y = v => padT + (1 - (v-lo)/(hi-lo))*ih;

    const css = getComputedStyle(document.documentElement);
    const acc  = css.getPropertyValue("--acc").trim()  || "#38bdf8";
    const txt3 = css.getPropertyValue("--txt3").trim() || "#64748b";

    const toPts = pts.map((v,i)=>[X(i), Y(v)]);
    const d = "M" + toPts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
    const areaD = `M${X(0).toFixed(1)},${(padT+ih).toFixed(1)} `
      + toPts.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")
      + ` L${X(pts.length-1).toFixed(1)},${(padT+ih).toFixed(1)} Z`;

    const gid = "grad" + Math.random().toString(36).slice(2,8);
    let gridLines = "", yLabels = "";
    for (let g=0; g<=3; g++){
      const v = lo + (hi-lo)*g/3;
      const y = Y(v);
      const dec = (hi - lo) < 5 && Math.abs(hi) < 1000;   /* tight range → 1 decimal, no dup labels */
      gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 5"/>`;
      yLabels  += `<text x="${padL-7}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="${txt3}" class="mono">${fmtY(v, opts.fmt, dec)}</text>`;
    }
    let xLabels = "";
    const step = Math.max(1, Math.ceil(pts.length/8));
    pts.forEach((v,i) => {
      if (i % step) return;
      xLabels += `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="${txt3}" class="mono">${opts.labels[i] ?? i}</text>`;
    });

    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${acc}" stop-opacity=".30"/>
          <stop offset="1" stop-color="${acc}" stop-opacity="0"/>
        </linearGradient></defs>
        ${gridLines}${yLabels}${xLabels}
        <path d="${areaD}" fill="url(#${gid})"/>
        <path d="${d}" fill="none" stroke="${acc}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        ${opts.target != null ? `<line x1="${padL}" x2="${W-padR}" y1="${Y(opts.target)}" y2="${Y(opts.target)}" stroke="var(--good)" stroke-dasharray="6 4" stroke-width="1.4" opacity=".8"/><text x="${W-padR}" y="${Y(opts.target)-5}" text-anchor="end" font-size="9" fill="var(--good)" class="mono">target ${opts.target}</text>` : ""}
        <circle class="hd" r="4.5" fill="${acc}" stroke="var(--panel-solid)" stroke-width="2" opacity="0"/>
        <line class="hl" y1="${padT}" y2="${padT+ih}" stroke="var(--txt3)" stroke-dasharray="3 4" opacity="0"/>
        <rect class="hr" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>
      </svg>`;

    const svg = el.querySelector("svg");
    const dot = el.querySelector(".hd"), hline = el.querySelector(".hl"), hit = el.querySelector(".hr");
    hit.onmousemove = e => {
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left)/r.width*W;
      const i = Math.max(0, Math.min(pts.length-1, Math.round((x-padL)/(iw/(pts.length-1)))));
      dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(pts[i])); dot.setAttribute("opacity","1");
      hline.setAttribute("x1", X(i)); hline.setAttribute("x2", X(i)); hline.setAttribute("opacity",".6");
      if (opts.onHover) opts.onHover(i);
    };
    hit.onmouseleave = () => { dot.setAttribute("opacity","0"); hline.setAttribute("opacity","0"); if (opts.onOut) opts.onOut(); };
  }

  function spark(el, data, color){
    const W=90,H=30,pad=2.5;
    const min=Math.min(...data), max=Math.max(...data), range=(max-min)||1;
    const pts = data.map((v,i)=>[pad+i*(W-2*pad)/(data.length-1), H-pad-(v-min)/range*(H-2*pad)]);
    const d = "M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
      <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
      <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.4" fill="${color}"/>
    </svg>`;
  }

  function donut(el, segs, centerTop, centerSub){
    const total = segs.reduce((s,x)=>s+x.v,0) || 1;
    const R=52, C=2*Math.PI*R;
    let off = 0, arcs = "";
    segs.forEach(s => {
      const frac = s.v/total, len = Math.max(frac*C - 2.5, 1.5);
      arcs += `<circle r="${R}" cx="75" cy="75" fill="none" stroke="${s.color}" stroke-width="17"
        stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
        stroke-linecap="butt"><title>${s.label}: ${s.v}</title></circle>`;
      off += frac*C;
    });
    el.innerHTML = `
      <svg viewBox="0 0 150 150" style="width:100%;height:100%;display:block">
        <circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--line)" stroke-width="17" opacity=".35"/>
        ${arcs}
      </svg>
      <div class="donut-c"><div><b>${centerTop}</b><span>${centerSub}</span></div></div>`;
  }

  /* SPC control chart: CL/UCL/LCL, ±3σ, violation dots, trend target */
  function controlChart(el, opts){
    const pts = opts.data;
    const W = 720, H = 250, padL = 40, padR = 14, padT = 18, padB = 26;
    const iw = W - padL - padR, ih = H - padT - padB;
    const cl = opts.cl, ucl = opts.ucl, lcl = opts.lcl;
    const bl = opts.baseline ? (Array.isArray(opts.baseline) ? { data: opts.baseline } : opts.baseline) : null;
    const hi = Math.max(ucl, ...pts, ...(bl ? bl.data : [])) + (ucl - cl) * 0.35;
    const lo = Math.min(lcl, ...pts, ...(bl ? bl.data : [])) - (cl - lcl) * 0.35;
    const X = i => padL + i*iw/(pts.length-1);
    const Y = v => padT + (1 - (v-lo)/(hi-lo))*ih;
    const css = getComputedStyle(document.documentElement);
    const acc  = css.getPropertyValue("--acc").trim()  || "#38bdf8";
    const bad  = css.getPropertyValue("--bad").trim()  || "#f87171";
    const txt3 = css.getPropertyValue("--txt3").trim() || "#64748b";
    const ooc  = pts.map((v,i) => (v > ucl || v < lcl) ? i : -1).filter(i => i >= 0);
    const we   = opts.we || {};
    const weIdx = Object.keys(we).map(Number).filter(i => !ooc.includes(i));

    const d = "M" + pts.map((v,i) => X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" L");
    const lim = (v, color, label) =>
      `<line x1="${padL}" x2="${W-padR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${color}" ${color==="var(--good)"?"stroke-dasharray=\"6 4\"":"stroke-dasharray=\"4 3\""} opacity=".85"/>
       <text x="${W-padR}" y="${(Y(v)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="${color}" class="mono">${label}</text>`;

    let xLabels = "";
    const step = Math.max(1, Math.ceil(pts.length/8));
    pts.forEach((v,i) => { if (!(i % step)) xLabels += `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="${txt3}" class="mono">${opts.labels[i] ?? i}</text>`; });

    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${lim(ucl, bad, "UCL " + (+ucl).toFixed(2))}
      ${lim(cl, "var(--good)", "CL " + (+cl).toFixed(2))}
      ${lim(lcl, bad, "LCL " + (+lcl).toFixed(2))}
      ${xLabels}
      ${bl ? `<path d="${"M"+bl.data.map((v,i) => X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" L")}" fill="none" stroke="${txt3}" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>
      <text x="${padL+4}" y="${padT+9}" font-size="8.5" fill="${txt3}">dashed = product baseline</text>` : ""}
      <path d="${d}" fill="none" stroke="${acc}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${ooc.map(i => `<circle cx="${X(i).toFixed(1)}" cy="${Y(pts[i]).toFixed(1)}" r="5" fill="none" stroke="${bad}" stroke-width="2"/>
        <circle cx="${X(i).toFixed(1)}" cy="${Y(pts[i]).toFixed(1)}" r="2" fill="${bad}"/>`).join("")}
      ${weIdx.map(i => `<circle cx="${X(i).toFixed(1)}" cy="${Y(pts[i]).toFixed(1)}" r="6.5" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="2.5 2" opacity=".95"/>`).join("")}
      <circle class="hd" r="4" fill="${acc}" stroke="var(--panel-solid)" stroke-width="2" opacity="0"/>
      <line class="hl" y1="${padT}" y2="${padT+ih}" stroke="${txt3}" stroke-dasharray="3 4" opacity="0"/>
      <rect class="hr" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>`;

    const svg = el.querySelector("svg"), dot = el.querySelector(".hd"), hline = el.querySelector(".hl"), hit = el.querySelector(".hr");
    hit.onmousemove = e => {
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left)/r.width*W;
      const i = Math.max(0, Math.min(pts.length-1, Math.round((x-padL)/(iw/(pts.length-1)))));
      dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(pts[i])); dot.setAttribute("opacity","1");
      hline.setAttribute("x1", X(i)); hline.setAttribute("x2", X(i)); hline.setAttribute("opacity",".6");
      if (opts.onHover) opts.onHover(i, ooc.includes(i), we[i]);
    };
    hit.onmouseleave = () => { dot.setAttribute("opacity","0"); hline.setAttribute("opacity","0"); if (opts.onOut) opts.onOut(); };
    return { ooc, outOfControl: ooc.length };
  }

  /* Pareto: sorted bars + cumulative % line */
  function pareto(el, items){
    const W = 720, H = 250, padL = 40, padR = 44, padT = 18, padB = 58;
    const iw = W - padL - padR, ih = H - padT - padB;
    const css = getComputedStyle(document.documentElement);
    const acc = css.getPropertyValue("--acc").trim() || "#38bdf8";
    const bad = css.getPropertyValue("--bad").trim() || "#f87171";
    const txt3 = css.getPropertyValue("--txt3").trim() || "#64748b";
    const total = items.reduce((s,x)=>s+x.v,0) || 1;
    let cum = 0;
    const pts = items.map(it => { cum += it.v; return cum/total*100; });
    const maxV = Math.max(...items.map(i=>i.v)) * 1.1;
    const X = i => padL + (i+0.5)*iw/items.length;
    const YL = v => padT + (1 - v/maxV)*ih;
    const YR = p => padT + (1 - p/100)*ih;
    const line = "M" + pts.map((p,i) => X(i).toFixed(1)+","+YR(p).toFixed(1)).join(" L");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${[0,25,50,75,100].map(p => `<line x1="${padL}" x2="${W-padR}" y1="${YR(p).toFixed(1)}" y2="${YR(p).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 5"/>
        <text x="${W-padR+6}" y="${(YR(p)+3).toFixed(1)}" font-size="9" fill="${txt3}" class="mono">${p}%</text>`).join("")}
      ${items.map((it,i) => {
        const y = YL(it.v), h = padT+ih - y;
        const color = (it.color || (i===0 ? bad : acc));
        return `<rect x="${(X(i)-Math.min(26,iw/items.length*0.32)).toFixed(1)}" y="${y.toFixed(1)}" width="${(Math.min(52,iw/items.length*0.64)).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${color}" opacity=".92"><title>${esc(it.label)}: ${it.v} (${(it.v/total*100).toFixed(1)}%)</title></rect>
          <text x="${X(i).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--txt2)" class="mono">${it.v}</text>`;
      }).join("")}
      <path d="${line}" fill="none" stroke="var(--pur)" stroke-width="2" stroke-linecap="round"/>
      ${pts.map((p,i) => `<circle cx="${X(i).toFixed(1)}" cy="${YR(p).toFixed(1)}" r="3" fill="var(--pur)"/>`).join("")}
      ${items.map((it,i) => `<text x="${X(i).toFixed(1)}" y="${H-40}" font-size="9" fill="${txt3}" transform="rotate(-28 ${X(i).toFixed(1)} ${H-40})" text-anchor="end">${esc(it.label.length>16?it.label.slice(0,15)+"…":it.label)}</text>`).join("")}
    </svg>`;
  }

  return { lineChart, spark, donut, controlChart, pareto };
})();

</script>
<script>
"use strict";
/* ============================================================
   FDB NPI Command Center — main app
   ============================================================ */

const STATE = {
  view: "overview",
  product: "ALL",
  stage: "ALL",
  side: "ALL",
  lot: "ALL",
  spcLot: "ALL",
  range: "30D",
  sortKey: null,
  sortDir: 1,
  hovered: null,
  ganttMode: "lots",
  ganttZoom: "week",
  ganttCenter: null,
};

const VIEWS = {
  overview:  { title:"Overview",       sub:"New Product Introduction · real-time command view" },
  products:  { title:"Products",       sub:"X4151–X4156 · stage, side, yield & volume" },
  processes: { title:"Processes",      sub:"Rotor · Pillow-stator · Fan assembly · Test accessory" },
  quality:   { title:"Quality — SPC",  sub:"Control charts · Cpk · Pareto · defect mix" },
  gantt:     { title:"Projects — Gantt", sub:"NPI stage gates & ramp plan" },
  faca:      { title:"FACA",           sub:"Follow-up & Corrective Action Committee" },
  claims:    { title:"Customer Claims",sub:"Complaints, containment & 8D" },
  shipments: { title:"Shipment Achievement", sub:"Commit vs actual, weekly" },
};

const $q  = s => document.querySelector(s);
const $q$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- helpers ---------- */
function delta(arr, n=1){
  const a = arr.at(-1-n), b = arr.at(-1);
  if (a === undefined || a === 0) return null;
  return (b - a) / a * 100;
}
const trendHtml = d => d == null ? `<span class="trend fl">—</span>`
  : `<span class="trend ${d>=0.05?"up":d<=-0.05?"dn":"fl"}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(1)}%</span>`;

function toast(msg, kind="acc"){
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = msg;
  $q("#toastRoot").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(20px)"; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

/* ---------- DataHub: demo (in-memory, persisted locally) or REST ---------- */
const DataHub = {
  mode: localStorage.getItem("fdb-dh-mode") || "demo",
  baseUrl: localStorage.getItem("fdb-dh-url") || "",
  async req(path, opt){
    const res = await fetch(this.baseUrl.replace(/\/$/,"") + path, {
      headers: { "Content-Type": "application/json" },
      ...opt,
    });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    return res.json();
  },
  testConnection(){
    if (this.mode !== "rest") return Promise.resolve({ ok:true, note:"demo mode — in-memory data, edits persist locally" });
    return this.req("/health").then(() => ({ ok:true, note:"REST endpoint answered /health" }))
      .catch(e => ({ ok:false, note:String(e.message || e) }));
  },
  async updateClaim(id, patch){
    if (this.mode === "rest") await this.req(`/claims/${id}`, { method:"PATCH", body: JSON.stringify(patch) });
    DB.updateClaim(id, patch);
  },
  async addClaim(claim){
    if (this.mode === "rest"){ const saved = await this.req("/claims", { method:"POST", body: JSON.stringify(claim) }); DB.addClaim(saved || claim); }
    else DB.addClaim(claim);
  },
  async updateFaca(id, patch){
    if (this.mode === "rest") await this.req(`/faca/${id}`, { method:"PATCH", body: JSON.stringify(patch) });
    DB.updateFaca(id, patch);
  },
};

/* ---------- CSV parse (RFC 4180-ish: quotes, escaped quotes, CRLF) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.length > 1 || row[0] !== "") rows.push(row);
  return rows;
}

/* ---------- CSV export (Excel-compatible BOM) ---------- */
function exportCSV(name, rows){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = [rows[0].map(q).join(","), ...rows.slice(1).map(r => r.map(q).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" }));
  a.download = name; a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported <b>${name}</b> (${rows.length - 1} rows)`, "good");
}
function exportProducts(){
  exportCSV("fdb-products.csv", [["Product","Model","Customer","Stage","Side","FPY","FY","UPH","OEE","Ship%","Claims","FACA","YTD","Target"],
    ...filteredProducts().map(p => { const k = DB.PRODUCT_KPI[p.id];
      return [p.id, p.name, p.customer, p.stage, p.side, k.fpy, k.fy, k.uph, k.oee, k.ship, k.claim, k.faca, p.vol.ytd, p.vol.target]; })]);
}
function exportClaims(){
  exportCSV("fdb-claims.csv", [["Claim","Product","Side","Customer","Severity","Status","Issue","Qty","Owner","ETA"],
    ...DB.CLAIMS.map(c => [c.id, c.product, c.side, c.customer, c.severity, c.status, c.issue, c.qty, c.owner, c.eta])]);
}
function exportShipments(){
  exportCSV("fdb-shipments.csv", [["Week","Commit","Actual","Achievement%"],
    ...DB.SHIPMENTS.map(s => [s.week, s.commit, s.actual, (s.actual/s.commit*100).toFixed(1)])]);
}

/* ---------- sortable products ---------- */
const SORTABLE = ["id","name","stage","lot","side","fpy","fy","uph","oee","ship","claim","vol"];
function sortedProducts(){
  const key = STATE.sortKey;
  const val = p => {
    const k = DB.PRODUCT_KPI[p.id];
    return ({ id:p.id, name:p.name, stage:p.stage, lot:(DB.PRODUCT_LOTS[p.id]||[]).join(","), side:p.side,
      fpy:k.fpy, fy:k.fy, uph:k.uph, oee:k.oee, ship:k.ship, claim:k.claim,
      vol:p.vol.ytd/p.vol.target })[key];
  };
  const arr = [...filteredProducts()];
  if (key) arr.sort((a,b) => { const x = val(a), y = val(b); return (x<y?-1:x>y?1:0) * STATE.sortDir; });
  return arr;
}

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const btn = $q("#themeBtn"); if (btn) btn.textContent = t === "dark" ? "🌙" : "☀️";
  try { localStorage.setItem("fdb-theme", t); } catch(e){}
}
function initTheme(){
  let t = null;
  try { t = localStorage.getItem("fdb-theme"); } catch(e){}
  applyTheme(t || "dark");
}

/* ---------- filtering ---------- */
function filteredProducts(){
  return DB.PRODUCTS.filter(p =>
    (STATE.product === "ALL" || p.id === STATE.product) &&
    (STATE.stage === "ALL" || p.stage === STATE.stage) &&
    (STATE.side === "ALL" || p.side.includes(STATE.side)) &&
    (STATE.lot === "ALL" || (DB.PRODUCT_LOTS[p.id] || []).includes(STATE.lot))
  );
}
function rebuildLotSelect(){
  const sel = $q("#lotSel");
  if (!sel) return;
  const avail = STATE.stage === "ALL" ? DB.LOTS : DB.LOTS.filter(l => l.stage === STATE.stage);
  sel.innerHTML = `<option value="ALL">All lots</option>` +
    avail.map(l => `<option value="${l.id}" ${STATE.lot===l.id?"selected":""}>${l.id} · ${l.stage} · ${DB.fmtW(l.units)}u</option>`).join("");
  if (STATE.lot !== "ALL" && !avail.some(l => l.id === STATE.lot)) STATE.lot = "ALL";
  sel.value = STATE.lot;
  sel.onchange = () => {
    STATE.lot = sel.value;
    if (STATE.lot !== "ALL"){
      const lot = DB.LOTS.find(l => l.id === STATE.lot);
      if (lot && STATE.stage === "ALL"){ STATE.stage = lot.stage; }
    }
    syncSegs();
    setView(STATE.view);
    toast(`Lot → <b>${STATE.lot==="ALL"?"All":STATE.lot}</b>`);
  };
}
function buildProductSelect(){
  const sel = $q("#productSel");
  sel.innerHTML = `<option value="ALL">All products</option>` +
    DB.PRODUCTS.map(p => `<option value="${p.id}" ${STATE.product===p.id?"selected":""}>${p.id} · ${esc(p.name)}</option>`).join("");
  sel.value = STATE.product;
  sel.onchange = () => {
    STATE.product = sel.value;
    // keep line/stage/lot coherent with the chosen product
    if (STATE.product !== "ALL"){
      const p = DB.PRODUCTS.find(x => x.id === STATE.product);
      if (p){
        if (p.stage !== STATE.stage){ STATE.stage = p.stage; STATE.lot = "ALL"; }
      }
    }
    syncSegs();
    setView(STATE.view);
    refreshBadges(); buildTicker();
    toast(`Product → <b>${STATE.product==="ALL"?"All":STATE.product}</b>`);
  };
}
function sliceByRange(series){
  const n = { "7D":7, "30D":14, "QTD":28, "YTD":42 }[STATE.range] ?? 14;
  return series.slice(-n);
}
function labelsFor(series, n){
  const out = [];
  const end = DB.TODAY;
  for (let i = n-1; i >= 0; i--){
    const d = new Date(end); d.setDate(d.getDate()-i);
    out.push(`${d.getMonth()+1}/${d.getDate()}`);
  }
  return out;
}
function isoOf(dt){
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}

/* ============================================================
   KPI SNAPSHOT — respects product/stage/side filters
   ============================================================ */
function kpiSnapshot(){
  const prods = filteredProducts();
  const stageIdx = STAGE_IDX[STATE.stage] ?? 1.5; // avg stage penalty
  const prodsAvg = key => prods.length
    ? prods.reduce((s,p)=>s+DB.PRODUCT_KPI[p.id][key],0)/prods.length
    : 96.2;

  let fpy  = prodsAvg("fpy");
  let fy   = prodsAvg("fy");
  let uph  = Math.round(prodsAvg("uph"));
  let oee  = prodsAvg("oee");
  let ship = prodsAvg("ship");

  // stage filter bias: blend toward stage-level values
  if (STATE.stage !== "ALL"){
    const sb = { P1:-3.4, P2:-2.1, EVT:-1.4, DVT:-0.6, PVT:0 }[STATE.stage] ?? 0;
    fpy += sb*0.55; fy += sb*0.3; uph = Math.round(uph + sb*8); oee += sb*0.7;
  }
  // side bias
  if (STATE.side !== "ALL"){
    fpy += (DB.SIDE_KPI[STATE.side].fpy - 96.2)*0.6;
    uph = Math.round(uph + (DB.SIDE_KPI[STATE.side].uph - 146)*0.5);
    oee += (DB.SIDE_KPI[STATE.side].oee - 79.5)*0.6;
  }
  // lot bias — selected lot's own KPIs dominate the blend
  if (STATE.lot !== "ALL" && DB.LOT_KPI[STATE.lot]){
    const lk = DB.LOT_KPI[STATE.lot];
    fpy = fpy*0.35 + lk.fpy*0.65;
    fy  = fy*0.35 + lk.fy*0.65;
    uph = Math.round(uph*0.35 + lk.uph*0.65);
    oee = oee*0.35 + lk.oee*0.65;
  }
  fpy  = Math.min(99.8, Math.max(84, fpy));
  fy   = Math.min(99.9, Math.max(90, fy));
  oee  = Math.min(94, Math.max(60, oee));
  ship = Math.min(100, Math.max(80, ship));

  const claims = DB.CLAIMS.filter(c =>
    (STATE.product==="ALL" || c.product===STATE.product) &&
    (STATE.side==="ALL" || c.side===STATE.side)
  ).length;
  const facas = DB.FACA.filter(f =>
    (STATE.product==="ALL" || f.product===STATE.product)
  ).length;

  return {
    fpy:+fpy.toFixed(1), fy:+fy.toFixed(1), uph, oee:+oee.toFixed(1), ship:+ship.toFixed(1),
    claim: claims, faca: facas,
    nProducts: prods.length,
  };
}
const STAGE_IDX = { P1:3.4, P2:2.1, EVT:1.4, DVT:0.6, PVT:0 };

/* ---------- range-shifted series for the filtered snapshot ---------- */
function shiftedSeries(base, shiftPct, n){
  const f = 1 + shiftPct/100;
  return base.slice(-n).map(v => +(v*f).toFixed(2));
}

function renderKpiCards(mount, snap){
  const S = DB.KPI_SERIES;
  const defs = [
    { id:"fpy",  ico:"✅", name:"FPY",  full:"First Pass Yield", val:`${snap.fpy}%`,  kc:"var(--good)", series:shiftedSeries(S.fpy, (snap.fpy-96.2)*0.8), target:96.5, note:"blended, rotor→test" },
    { id:"fy",   ico:"🏁", name:"FY",   full:"Final Yield",      val:`${snap.fy}%`,   kc:"var(--acc)",  series:shiftedSeries(S.fy, (snap.fy-98.2)*0.8),  target:98.5, note:"incl. rework recovery" },
    { id:"uph",  ico:"⚡", name:"UPH",  full:"Units Per Hour",   val:snap.uph,        kc:"var(--pur)",  series:shiftedSeries(S.uph,(snap.uph-148)*2),    target:160,  note:"line-rated" },
    { id:"oee",  ico:"🏭", name:"OEE",  full:"Overall Equipment Effectiveness", val:`${snap.oee}%`, kc:"var(--warn)", series:shiftedSeries(S.oee,(snap.oee-78.5)*1.2), target:82, note:"A × P × Q" },
    { id:"ship", ico:"📦", name:"SHIP", full:"Shipment Achievement", val:`${snap.ship}%`, kc:"var(--acc)", series:shiftedSeries(S.ship,(snap.ship-97.5)*0.9), target:100, note:"commit vs actual" },
    { id:"claim",ico:"⚑",  name:"CLAIM",full:"Customer Claims",  val:snap.claim,      kc:"var(--bad)",  series:S.claim.slice(-14).map(v=>v + (snap.claim - S.claim.at(-1))), target:0, note:"open, quarter" },
    { id:"faca", ico:"✎",  name:"FACA", full:"FACA Actions",     val:snap.faca,       kc:"var(--bad)",  series:S.faca.slice(-14).map(v=>v + (snap.faca - S.faca.at(-1))),   target:0, note:"open actions" },
  ];
  mount.innerHTML = defs.map(d => `
    <div class="card kpi" data-kpi="${d.id}" title="${esc(d.full)}">
      <div class="kpi-top">
        <span class="kpi-ico" style="--kc:${d.kc}">${d.ico}</span>
        <span class="pill ${d.id==="claim"||d.id==="faca" ? (d.val>0?"warn":"good") : "acc"}">${d.id==="claim"||d.id==="faca" ? (d.val>0?"open":"clear") : "vs " + d.target + (d.id==="uph"?"":"%")}</span>
      </div>
      <div class="kpi-name">${d.name}</div>
      <div class="kpi-val">${d.val}${typeof d.val==="number" ? "" : ""}</div>
      <div class="kpi-foot">
        ${trendHtml(delta(d.series))}
        <div class="kpi-spark" data-spark="${d.id}"></div>
      </div>
      <div class="kpi-note">${d.note}</div>
    </div>`).join("");

  mount.querySelectorAll("[data-spark]").forEach(el => {
    const id = el.dataset.spark;
    const def = defs.find(x=>x.id===id);
    const goodUp = !(id==="claim" || id==="faca");
    const last = def.series.at(-1), prev = def.series.at(-5) ?? last;
    const up = last >= prev;
    const color = (goodUp ? (up ? "var(--good)" : "var(--bad)") : (up ? "var(--bad)" : "var(--good)"));
    CHARTS.spark(el, def.series, color);
  });

  mount.querySelectorAll(".kpi").forEach(card => {
    card.onclick = () => { STATE.view = "kpi"; STATE.kpiFocus = card.dataset.kpi; setView("kpi"); };
  });
}

const WE_NAMES = { R1:"Beyond 3σ", R2:"2 of 3 beyond 2σ", R3:"4 of 5 beyond 1σ", R4:"8 consecutive one side" };

function mountQuality(){
  /* ---- SPC scope: blended baseline or a single production lot ---- */
  const sel = $q("#spcLot");
  sel.innerHTML = `<option value="ALL">Product baseline — blended</option>` +
    DB.LOTS.map(l => `<option value="${l.id}">${l.id} · ${l.stage} lot</option>`).join("");
  sel.value = STATE.spcLot && DB.LOTS.some(l => l.id === STATE.spcLot) ? STATE.spcLot : "ALL";
  sel.onchange = () => { STATE.spcLot = sel.value; mountQuality(); };
  const lotId = sel.value === "ALL" ? null : sel.value;
  const base = DB.spcSamples();                        // blended baseline for scope
  const cur  = lotId ? DB.spcSamples(lotId) : base;    // selected series
  const { labels, data } = cur;
  const LSL = 93.0;                        // FPY spec floor
  const st = DB.spcStats(data);
  const cpk = (st.cl - LSL) / (3 * st.sd);
  const we = DB.westernElectric(data, st);
  const weCount = Object.keys(we).length;
  const scope = lotId ? `${lotId} lot` : "Baseline";
  const res = CHARTS.controlChart($q("#spcChart"), {
    data, labels, cl: st.cl, ucl: st.ucl, lcl: st.lcl, we,
    baseline: lotId ? base.data : null,
    onHover: (i, ooc, rules) => $q("#spcVal").textContent = `${labels[i]} · ${data[i]}%${ooc ? " · ⚠ OUT OF CONTROL" : rules ? " · " + rules.map(r=>WE_NAMES[r]).join(" + ") : ""}`,
    onOut: () => $q("#spcVal").textContent = `${scope} · CL ${st.cl.toFixed(2)}% · σ ${st.sd.toFixed(2)} · ${weCount} WE signal${weCount===1?"":"s"}`,
  });
  $q("#spcVal").textContent = `${scope} · CL ${st.cl.toFixed(2)}% · σ ${st.sd.toFixed(2)} · ${weCount} WE signal${weCount===1?"":"s"}`;
  $q("#oocCount").textContent = `${res.outOfControl} beyond limits · ${weCount} WE signals`;
  $q("#spcScopeNote").textContent = lotId
    ? `Lot ${lotId} overlay — dashed gray line is the blended product baseline (CL ${DB.spcStats(base.data).cl.toFixed(2)}%).`
    : "Baseline view — blended FPY across lots in filter scope. Pick a lot to overlay it.";
  $q("#spcCsv").onclick = () => exportCSV(`fdb-spc-${(lotId || "baseline").toLowerCase()}.csv`, [
    ["Sample","Date","FPY%","CL","UCL","LCL","Signal"],
    ...cur.data.map((v,i) => [i+1, cur.labels[i], v, st.cl.toFixed(2), st.ucl.toFixed(2), st.lcl.toFixed(2),
      res.ooc.includes(i) ? "beyond-3sigma" : (we[i] ? we[i].join("+") : "")]),
  ]);

  // known special causes (sample-index keyed)
  const causes7 = {
    7:  { t:"D01 bearing-noise event", d:"X4152 RHS acoustic escape — containment started, see CL-2213" },
    16: { t:"D02 torque drift window", d:"DC bit wear beyond PM interval — FACA FA-097 corrective" },
    23: { t:"D04 press-fit OOS spike", d:"Pillow-stator force window widening — FACA FA-101" },
    28: { t:"Recovery after sort", d:"Containment effective — back within limits" },
  };

  // consolidated signal list: ±3σ violations first, then WE rules
  const signals = [];
  res.ooc.forEach(i => signals.push({ i, sev:"bad", label:"Beyond ±3σ", note: lotId ? "Lot-level breach — check this lot's phases in the Gantt" : (causes7[i]||{}).t || "Investigate immediately" }));
  Object.keys(we).map(Number).sort((a,b)=>a-b).forEach(i => {
    if (res.ooc.includes(i)) return;
    signals.push({ i, sev:"warn", label:we[i].map(r=>WE_NAMES[r]).join(" + "), note:"Early-warning pattern — review before it becomes a breach" });
  });

  // stat cards
  const lotProdIds = lotId ? DB.PRODUCTS.filter(p => (DB.PRODUCT_LOTS[p.id]||[]).includes(lotId)).map(p => p.id) : null;
  const defects = DB.DEFECTS.filter(d => (STATE.product==="ALL" || d.product===STATE.product) && (!lotProdIds || lotProdIds.includes(d.product)));
  const totalDef = defects.reduce((s,d)=>s+d.qty,0);
  const vol = filteredProducts().reduce((s,p)=>s+p.vol.ytd,0) || 1;
  const ppm = Math.round(totalDef / vol * 1e6);
  const top = [...defects].sort((a,b)=>b.qty-a.qty)[0];
  $q("#qStats").innerHTML = [
    { name:"Cpk (lower spec)", val:cpk.toFixed(2), ico:"📏", kc:"var(--acc)", note:cpk>=1.33?"capable (≥1.33)":cpk>=1?"marginal":"not capable", cls:cpk>=1.33?"good":cpk>=1?"warn":"bad" },
    { name:"Out-of-control pts", val:res.outOfControl, ico:"⚠", kc:"var(--bad)", note:"last 30 samples", cls:res.outOfControl?"bad":"good" },
    { name:"Defect PPM", val:ppm.toLocaleString(), ico:"🔎", kc:"var(--pur)", note:"defects vs YTD volume", cls:"acc" },
    { name:"Top defect", val:top ? top.qty : 0, ico:"🥇", kc:"var(--warn)", note:top ? `${top.code} ${top.name}` : "—", cls:top&&top.sev==="Critical"?"bad":"warn" },
  ].map(d => `
    <div class="card kpi">
      <div class="kpi-top"><span class="kpi-ico" style="--kc:${d.kc}">${d.ico}</span><span class="pill ${d.cls}">${d.name.split(" ")[0]==="Cpk"?"SPC":"30d"}</span></div>
      <div class="kpi-name">${d.name}</div>
      <div class="kpi-val" style="font-size:22px">${d.val}</div>
      <div class="kpi-note">${esc(d.note)}</div>
    </div>`).join("");

  $q("#oocList").innerHTML = signals.length ? signals.map(s => {
    const c = lotId ? null : causes7[s.i];
    return `<div class="item" style="cursor:default">
      <div class="item-ico" style="background:var(--${s.sev}-soft);color:var(--${s.sev})">${s.sev==="bad"?"⚠":"∿"}</div>
      <div class="item-body"><div class="item-title">${labels[s.i]} · ${data[s.i]}% — ${esc(s.label)}</div><div class="item-sub">${c ? esc(c.t) + " — " + esc(c.d) : esc(s.note)}</div></div>
    </div>`;
  }).join("") : `<div class="empty">Process in control — no signals</div>`;

  // pareto + donut
  CHARTS.pareto($q("#pareto"), [...defects].sort((a,b)=>b.qty-a.qty).slice(0,8).map(d => ({ label:`${d.code} ${d.name}`, v:d.qty })));
  const byProc = {};
  defects.forEach(d => byProc[d.process] = (byProc[d.process]||0) + d.qty);
  const segs = DB.PROCESSES.filter(p=>byProc[p.id]).map((p,i) => ({ label:p.name, v:byProc[p.id], color:["var(--bad)","var(--warn)","var(--acc)","var(--pur)"][i%4] }));
  CHARTS.donut($q("#defDonut"), segs, totalDef, "defects");
  $q("#defLeg").innerHTML = segs.map(s=>`<div class="dl"><i style="width:9px;height:9px;border-radius:3px;display:inline-block;background:${s.color}"></i>${esc(s.label)}<b>${s.v}</b></div>`).join("");
}
